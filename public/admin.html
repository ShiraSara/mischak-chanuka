<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ניהול – משחק הסקר</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<section id="v-login" class="center-page">
  <form class="card" id="f-login" style="max-width:380px;width:100%;text-align:center">
    <h1 class="brand-title" style="font-size:1.8rem">ניהול</h1>
    <input type="password" id="pw" placeholder="סיסמת ניהול" />
    <p class="error" id="login-err"></p>
    <button class="btn primary" style="width:100%">כניסה</button>
  </form>
</section>

<section id="v-main" hidden>
  <div class="wrap">
    <div class="row" style="justify-content:space-between">
      <h1 class="brand-title">ניהול משחק הסקר</h1>
      <button class="btn ghost" id="btn-out">יציאה</button>
    </div>

    <div class="card">
      <h2>יצירת קוד ללקוחה</h2>
      <p class="muted" style="margin-top:0">אחרי שקיבלת העברה בנקאית – צרי קוד ושלחי ללקוחה יחד עם הקישור לאתר.</p>
      <form id="f-code" class="settings-grid">
        <label class="grow" style="flex-direction:column;align-items:stretch">שם / הערה (למשל: רחל כהן – שולם 23/11)
          <input type="text" id="c-label" /></label>
        <label style="flex-direction:column;align-items:stretch">קוד (ריק = מספר אקראי)
          <input type="text" id="c-code" class="ltr" /></label>
        <label style="flex-direction:column;align-items:stretch">תוקף בימים (0 = ללא הגבלה)
          <input type="number" id="c-days" value="30" min="0" /></label>
        <label style="flex-direction:column;align-items:stretch">מספר משחקים (0 = ללא הגבלה)
          <input type="number" id="c-max" value="1" min="0" /></label>
        <div style="align-self:end"><button class="btn primary">יצירת קוד</button></div>
      </form>
      <p class="error" id="code-err"></p>
      <div id="new-code" class="note" hidden></div>
    </div>

    <div class="card">
      <h2>הקודים</h2>
      <div style="overflow:auto"><table class="admin" id="codes"></table></div>
    </div>

    <div class="card">
      <h2>מאגר השאלות הכללי</h2>
      <p class="muted" style="margin-top:0">זה המאגר שכל לקוחה רואה כברירת מחדל. שורה לכל שאלה. לשאלה עם תשובות קבועות (לא שמות) כתבי בסוף: <code>| תשובה1, תשובה2, תשובה3</code></p>
      <textarea id="bank" rows="20" style="font-size:1rem;line-height:1.7"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="btn-bank">שמירת המאגר</button>
        <span id="bank-msg" class="muted"></span>
      </div>
    </div>
  </div>
</section>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let pw = sessionStorage.getItem('seker_admin') || '';

async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json', 'x-admin-password': pw }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'שגיאה');
  return d;
}

$('#f-login').onsubmit = async (e) => {
  e.preventDefault();
  pw = $('#pw').value;
  try { await start(); sessionStorage.setItem('seker_admin', pw); }
  catch (er) { $('#login-err').textContent = er.message; }
};
$('#btn-out').onclick = () => { sessionStorage.removeItem('seker_admin'); location.reload(); };

async function start() {
  await loadCodes();
  await loadBank();
  $('#v-login').hidden = true;
  $('#v-main').hidden = false;
}

const fmt = (t) => t ? new Date(t).toLocaleDateString('he-IL') : '—';

async function loadCodes() {
  const { codes } = await api('/api/admin/codes');
  $('#codes').innerHTML = `<tr><th>קוד</th><th>שם / הערה</th><th>נוצר</th><th>בתוקף עד</th><th>משחקים</th><th>מצב</th><th></th></tr>` +
    codes.map(c => {
      const expired = c.expires_at && c.expires_at < Date.now();
      return `<tr data-code="${esc(c.code)}">
        <td><span class="code-txt">${esc(c.code)}</span></td>
        <td>${esc(c.label)}</td>
        <td>${fmt(c.created_at)}</td>
        <td>${c.expires_at ? fmt(c.expires_at) + (expired ? ' <span class="tag" style="background:#fbeaea;color:#c93c3c">פג</span>' : '') : 'ללא הגבלה'}</td>
        <td>${c.games_used}${c.max_games ? ' / ' + c.max_games : ''}</td>
        <td>${c.active ? '<span class="tag">פעיל</span>' : '<span class="tag opt">מושבת</span>'}</td>
        <td class="row">
          <button class="btn small" data-a="toggle">${c.active ? 'השבתה' : 'הפעלה'}</button>
          <button class="btn small" data-a="days">+ימים</button>
          <button class="btn small" data-a="games">שינוי משחקים</button>
          <button class="btn small danger" data-a="del">מחיקה</button>
        </td></tr>`;
    }).join('');
  window._codes = Object.fromEntries(codes.map(c => [c.code, c]));
}

$('#codes').onclick = async (e) => {
  const a = e.target.dataset.a; if (!a) return;
  const code = e.target.closest('tr').dataset.code;
  const c = window._codes[code];
  try {
    if (a === 'toggle') await api('/api/admin/codes/' + code, 'PATCH', { active: !c.active });
    if (a === 'days') { const d = prompt('כמה ימים להוסיף? (0 = ללא הגבלה)', '30'); if (d === null) return; await api('/api/admin/codes/' + code, 'PATCH', { addDays: Number(d) }); }
    if (a === 'games') { const d = prompt('מספר משחקים כולל (0 = ללא הגבלה). כרגע נוצלו ' + c.games_used, c.max_games || 0); if (d === null) return; await api('/api/admin/codes/' + code, 'PATCH', { maxGames: Number(d) }); }
    if (a === 'del') { if (!confirm('למחוק את הקוד ' + code + '?')) return; await api('/api/admin/codes/' + code, 'DELETE'); }
    loadCodes();
  } catch (er) { alert(er.message); }
};

$('#f-code').onsubmit = async (e) => {
  e.preventDefault();
  $('#code-err').textContent = '';
  try {
    const r = await api('/api/admin/codes', 'POST', { label: $('#c-label').value, code: $('#c-code').value, days: $('#c-days').value, maxGames: $('#c-max').value });
    $('#new-code').hidden = false;
    $('#new-code').innerHTML = `✓ נוצר הקוד <span class="code-txt">${esc(r.code)}</span><br>טקסט לשליחה ללקוחה:<br><textarea rows="3" onclick="this.select()">שלום! הקישור למשחק: ${location.origin}\nקוד הכניסה שלך: ${r.code}</textarea>`;
    $('#c-label').value = ''; $('#c-code').value = '';
    loadCodes();
  } catch (er) { $('#code-err').textContent = er.message; }
};

async function loadBank() {
  const { questions } = await api('/api/admin/bank');
  $('#bank').value = questions.map(q => q.type === 'options' ? `${q.text} | ${q.options.join(', ')}` : q.text).join('\n');
}
$('#btn-bank').onclick = async () => {
  const questions = $('#bank').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const [t, o] = l.split('|');
    return o ? { text: t.trim(), type: 'options', options: o.split(',').map(s => s.trim()).filter(Boolean) } : { text: t.trim(), type: 'names' };
  });
  try {
    const r = await api('/api/admin/bank', 'PUT', { questions });
    $('#bank-msg').textContent = `✓ נשמרו ${r.questions.length} שאלות`;
    loadBank();
  } catch (er) { alert(er.message); }
};

if (pw) start().catch(() => {});
</script>
</body>
</html>
