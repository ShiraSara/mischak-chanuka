<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>סימולטור טלפון</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .phone { max-width: 340px; margin: 20px auto; background: #222; color: #eee; border-radius: 28px; padding: 22px; }
    .screen { background: #cfe3c5; color: #1d2a18; border-radius: 10px; padding: 12px; min-height: 150px; font-size: 1rem; }
    .screen .say { margin-bottom: 6px; }
    .screen .typed { font-size: 1.8rem; font-weight: 900; direction: ltr; text-align: center; min-height: 2.4rem; }
    .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
    .keys button { background: #444; color: #fff; border: 0; border-radius: 12px; padding: 14px; font-size: 1.4rem; font-weight: 700; cursor: pointer; }
    .keys button:active { background: #666; }
    .raw { direction: ltr; text-align: left; font-family: monospace; font-size: .8rem; white-space: pre-wrap; word-break: break-all; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap" style="max-width:520px">
    <h1 class="brand-title" style="font-size:1.8rem">סימולטור טלפון</h1>
    <p class="sub">מדמה שיחה למערכת הטלפונית בדיוק כמו טלפון כשר. אפשר לפתוח כמה לשוניות כדי לדמות כמה משתתפות.</p>
    <div class="card">
      <label>מתקשרת מהמספר:
        <select id="who"></select>
      </label>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="btn-call">📞 חיוג</button>
        <button class="btn danger" id="btn-hang">ניתוק</button>
      </div>
    </div>
    <div class="phone">
      <div class="screen" id="screen"><div class="say">לחצי "חיוג" כדי להתחיל</div></div>
      <div class="keys" id="keys"></div>
      <div class="row" style="margin-top:10px;justify-content:center">
        <button class="btn small" id="btn-timeout" title="מדמה מצב שלא הקישו כלום עד שנגמר זמן ההמתנה">⌛ לא הקשתי (המתנה)</button>
      </div>
    </div>
    <details><summary class="muted">מה השרת שולח לימות המשיח (לבדיקה טכנית)</summary><div class="raw" id="raw"></div></details>
  </div>
<script>
const $ = (s) => document.querySelector(s);
const token = localStorage.getItem('seker_token');
const gameId = new URLSearchParams(location.search).get('game');
let vals = null, varName = null, typed = '', callId = null;

$('#keys').innerHTML = ['1','2','3','4','5','6','7','8','9','*','0','#'].map(k => `<button data-k="${k}">${k}</button>`).join('');

async function loadPlayers() {
  const r = await fetch(`/api/games/${gameId}`, { headers: { authorization: 'Bearer ' + token } });
  const s = await r.json();
  const opts = s.players.map(p => `<option value="${p.hasPhone ? 'p' + p.num : ''}">${p.num}. ${p.name}${p.hasPhone ? '' : ' (אין טלפון רשום)'}</option>`);
  $('#who').innerHTML = opts.join('') + '<option value="">מספר לא מזוהה / חסוי</option>';
  window._players = s.players;
}

async function send() {
  const pick = $('#who').value;
  // הטלפון האמיתי לא נחשף לדפדפן; השרת מוצא אותו לפי מספר המשתתפת
  const res = await fetch(`/api/games/${gameId}/sim`, {
    method: 'POST',
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
    body: JSON.stringify({ params: vals, simPlayer: pick ? Number(pick.slice(1)) : null }),
  });
  const data = await res.json();
  if (!res.ok) return show([data.error || 'שגיאה'], true);
  $('#raw').textContent = data.response;
  const parts = data.response.split('&').filter(Boolean);
  const lines = [];
  varName = null;
  let hang = false;
  for (const p of parts) {
    const [cmd, ...rest] = p.split('=');
    if (cmd === 'id_list_message') lines.push(...speak(rest.join('=')));
    if (cmd === 'read') { lines.push(...speak(rest[0])); varName = rest[1].split(',')[0]; }
    if (cmd === 'go_to_folder' && rest[0] === 'hangup') hang = true;
  }
  if (hang) { lines.push('— השיחה נותקה —'); callId = null; }
  show(lines);
}

function speak(m) {
  return m.split('.').map(x => x.startsWith('t-') ? x.slice(2) : x.startsWith('n-') ? x.slice(2) : x).join(' ').split('\n');
}

function show(lines) {
  typed = '';
  $('#screen').innerHTML = lines.map(l => `<div class="say">🔊 ${l.replace(/</g, '&lt;')}</div>`).join('') + '<div class="typed" id="typed"></div>';
}

$('#btn-call').onclick = async () => {
  callId = 'sim-' + Math.random().toString(36).slice(2);
  vals = { ApiCallId: callId, ApiDID: '0770000000', ApiExtension: '1' };
  await send();
};
$('#btn-hang').onclick = async () => {
  if (!callId) return;
  vals.hangup = 'yes';
  await send();
  show(['— השיחה נותקה —']);
  callId = null;
};
$('#btn-timeout').onclick = async () => {
  if (!callId || !varName) return;
  vals[varName] = 'None';
  await send();
};
$('#keys').onclick = async (e) => {
  const k = e.target.dataset.k;
  if (!k || !callId || !varName) return;
  if (k === '#') {
    vals[varName] = typed;
    await send();
    return;
  }
  if (k === '*') { typed = ''; } else typed += k;
  $('#typed').textContent = typed;
  // ימות המשיח מסיימת אוטומטית כשמגיעים למספר הספרות המקסימלי
  const max = Number(($('#raw').textContent.match(/read=[^=]*=[^,]+,[^,]*,(\d+)/) || [])[1] || 99);
  if (typed.length >= max) { vals[varName] = typed; await send(); }
};

if (!token || !gameId) show(['צריך לפתוח את הסימולטור מתוך מסך המשחק']);
else loadPlayers();
</script>
</body>
</html>
